<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全事件模拟器 — 安全培训</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .simulator { max-width: 700px; margin: 0 auto; }
        .sim-header { text-align: center; padding: 20px; font-size: 0.9rem; color: var(--text-secondary); }
        .sim-scenario { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .sim-scenario .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-bottom: 12px; }
        .badge-phishing { background: #fef2f2; color: #991b1b; }
        .badge-social { background: #fff7ed; color: #9a3412; }
        .badge-tech { background: #f3e8ff; color: #6b21a8; }
        .badge-finance { background: #eff6ff; color: #1e40af; }
        .sim-scenario h3 { font-size: 1.15rem; margin-bottom: 12px; }
        .sim-scenario .context { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.6; }
        .sim-scenario .sim-message { background: #f0f4ff; border-left: 4px solid var(--primary); padding: 14px 18px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 16px; font-size: 0.92rem; line-height: 1.7; white-space: pre-wrap; }
        .action-btns { display: grid; gap: 10px; }
        .action-btn { padding: 14px 20px; text-align: left; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 0.95rem; transition: all 0.2s; font-family: inherit; }
        .action-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
        .action-btn:disabled { cursor: default; opacity: 0.8; }
        .action-btn.good { border-color: var(--success); background: var(--success-light); color: var(--success); }
        .action-btn.bad { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
        .action-btn.neutral { border-color: var(--warning); background: var(--warning-light); color: #92400e; }
        .sim-feedback { padding: 16px 20px; border-radius: var(--radius-sm); margin-top: 16px; font-size: 0.9rem; line-height: 1.6; display: none; }
        .sim-feedback.show { display: block; }
        .sim-feedback.good { background: var(--success-light); border: 1px solid #bbf7d0; }
        .sim-feedback.bad { background: var(--danger-light); border: 1px solid #fecaca; }
        .sim-feedback h4 { font-size: 1rem; margin-bottom: 6px; }
        .sim-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .sim-progress { text-align: center; margin-bottom: 24px; }
        .sim-progress .score { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🛡️ 安全培训</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="demo.html">模拟演示</a></li>
                <li><a href="password.html">密码检测</a></li>
                <li><a href="url-checker.html">URL检测</a></li>
                <li><a href="ransomware.html">勒索软件</a></li>
                <li><a href="scam-case.html">诈骗案例</a></li>
                <li><a href="security-simulator.html" class="active">安全模拟</a></li>
                <li><a href="safety-check.html">安全检查</a></li>
                <li><a href="quiz.html">测验</a></li>
                <li><a href="guide.html">防护指南</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
                <button id="theme-toggle" class="theme-toggle" title="切换深色模式">🌙</button>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>🎮 安全事件模拟器</h1>
            <p class="page-desc">模拟真实的安全事件场景，测试你的应对能力。每个场景你都需要做出选择。</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="simulator">
                <div class="sim-progress">
                    <span id="progress-text">场景 1 / 6</span> &nbsp;·&nbsp; 
                    <span class="score">得分：<span id="score-display">0</span></span>
                </div>

                <div id="scenario-container">
                    <!-- 由 JS 生成 -->
                </div>

                <div class="sim-controls">
                    <button class="btn btn-secondary" onclick="resetSimulator()" style="background:var(--bg);color:var(--text-secondary);border:1px solid var(--border);">🔄 重新开始</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>🔐 本网站为网络安全意识培训用途 · 不收集任何用户数据</p>
            <p>仅供教育和培训使用 · 请勿用于非法目的</p>
        </div>
    </footer>

    <script>
        const scenarios = [
            {
                id: 1, category: 'phishing',
                title: '📧 可疑的银行邮件',
                badgeText: '钓鱼邮件',
                badgeClass: 'badge-phishing',
                context: '你收到一封来自"XX银行"的邮件，发件地址是 service@xxbank-security.net。邮件称你的账户存在"异常登录"，要求点击链接验证身份，否则"24小时内冻结账户"。',
                message: '发件人：service@xxbank-security.net\n主题：【紧急】您的账户存在异常登录，请立即验证！\n\n尊敬的用户：\n我们检测到您的账户在异地登录，为确保安全，请立即点击下方链接验证：\nhttp://xxbank-verify.safe-login.net/verify\n\n如未在24小时内完成验证，您的账户将被暂时冻结。\n\nXX银行安全团队',
                options: [
                    { text: '点击链接，按要求输入账号密码验证', type: 'bad', feedback: '❌ 这是钓鱼邮件！点击链接会进入仿冒的银行页面，输入的账号密码会被骗子窃取。正确的做法是：手动输入银行官网地址登录查看。', verdict: '-1 分' },
                    { text: '忽略邮件，手动打开银行官网或 App 查看', type: 'good', feedback: '✅ 正确！银行不会通过邮件链接要求验证账户。手动打开你熟悉的官网或 App 登录查看是最安全的方式。如果账户真的有问题，官网登录后会有提示。', verdict: '+1 分' },
                    { text: '回复邮件询问详细情况', type: 'bad', feedback: '❌ 回复邮件会让骗子确认这个邮箱地址是活跃的，之后可能会收到更多钓鱼邮件。切勿回复可疑邮件！', verdict: '-1 分' }
                ]
            },
            {
                id: 2, category: 'social',
                title: '📞 突如其来的"客服"电话',
                badgeText: '电话诈骗',
                badgeClass: 'badge-social',
                context: '你接到了一个电话，对方自称是"抖音客服"，说你开通了"电商会员"服务，每月会自动扣费 500 元。对方说可以帮你取消，但需要你下载一个"会议 App"并开启"屏幕共享"功能。',
                message: '客服：您好，我是抖音客服张小丽。您在我们平台开通了电商会员服务，每月会自动扣费500元。\n\n您：我没开通过啊？\n\n客服：可能是您误操作了。我这边可以帮您取消，但是需要您配合验证身份。请先下载"XX会议"App，然后我会引导您操作取消。',
                options: [
                    { text: '下载 App 并开启屏幕共享，让客服指导操作', type: 'bad', feedback: '❌ 屏幕共享等于把你的手机屏幕完全暴露给对方！对方可以看到你输入的密码、验证码等一切信息。这是近期高发的诈骗手法。', verdict: '-1 分' },
                    { text: '挂断电话，通过官方 App 内客服核实', type: 'good', feedback: '✅ 正确！正规平台的客服不会主动打电话说要帮你"取消会员"。挂断后打开抖音官方 App，通过内置客服渠道核实。真正的取消操作在 App 设置里就能完成。', verdict: '+1 分' },
                    { text: '告诉对方自己年纪大了不会操作，让帮忙直接取消', type: 'bad', feedback: '❌ 无论你用什么借口，骗子都会"热心"地一步步引导你操作，直到你转账为止。不要与骗子周旋，直接挂断。', verdict: '-1 分' }
                ]
            },
            {
                id: 3, category: 'tech',
                title: '💻 电脑弹出的"中毒警告"',
                badgeText: '技术支持诈骗',
                badgeClass: 'badge-tech',
                context: '你在浏览网页时，浏览器突然弹出全屏红色警告："您的电脑已被病毒感染！已检测到 5 个高危病毒！请立即拨打 400-XXX-XXXX 联系微软技术支持，以免造成数据损失！"同时电脑发出警报声。',
                message: '⚠️ 系统安全警告 ⚠️\n\n您的电脑已被病毒感染！\n检测到：5 个高危病毒\n风险：键盘记录、数据泄露\n\n请立即拨打免费热线：400-XXX-XXXX\n（24小时免费技术支持）\n\nWindows 安全中心',
                options: [
                    { text: '拨打热线电话，让"工程师"远程处理', type: 'bad', feedback: '❌ 这是经典的"技术支持诈骗"！浏览器弹窗不是系统警告。拨打电话后，骗子会引导你安装远程控制软件，然后假装扫描出"病毒"，收几百到几千元的"杀毒费"。', verdict: '-1 分' },
                    { text: '按下 Alt+F4 关闭浏览器窗口，运行杀毒软件扫描', type: 'good', feedback: '✅ 正确！浏览器弹窗只是网页特效，不是真正的系统警告。关掉浏览器标签页就消失了。如果还不放心，运行你安装的正版杀毒软件扫描一下即可。', verdict: '+1 分' },
                    { text: '按弹窗上的"立即扫描"按钮', type: 'bad', feedback: '❌ 点击弹窗上的任何按钮都可能下载真正的恶意软件！永远不要点击弹窗上的按钮，直接关闭整个浏览器窗口。', verdict: '-1 分' }
                ]
            },
            {
                id: 4, category: 'finance',
                title: '💰 "高回报投资"微信群',
                badgeText: '投资诈骗',
                badgeClass: 'badge-finance',
                context: '你被拉进一个"内部投资交流群"，群里有个"老师"每天分享"涨停股"。很多群友晒出"收益截图"，说跟着老师一个月赚了 50%。老师说现在有个"内部项目"，投资 10 万一个月后返还 15 万。',
                message: '老师：各位家人，我这边刚拿到一个内部项目，只有 20 个名额，投 10 万一个月后返还 15 万，稳赚不赔！\n\n群友 A：感谢老师！上次跟老师投的 5 万已经翻倍了！\n群友 B：已转账，老师带我飞！\n群友 C：这么赚钱的项目，幸好我抢到了一个名额！',
                options: [
                    { text: '先投 1 万试试，如果收益能提现再加仓', type: 'bad', feedback: '❌ 这是典型的"杀猪盘"！群里除了你全是骗子的托。前期小额确实可以提现（"养鱼"阶段），等你投入大额后平台就会关闭，群也会解散。', verdict: '-1 分' },
                    { text: '不相信，退出群并举报', type: 'good', feedback: '✅ 正确！承诺"稳赚不赔"、"高回报"的都是诈骗。正规投资都有风险。退出群聊并在微信中举报该群（选择"涉嫌诈骗"）。', verdict: '+1 分' },
                    { text: '在群里问更多细节，再看看', type: 'bad', feedback: '❌ 不要与骗子纠缠！群里的"群友"会轮番说服你。他们会发假的收益截图、伪造的银行转账记录来获取你的信任。最好的选择是直接退群举报。', verdict: '-1 分' }
                ]
            },
            {
                id: 5, category: 'phishing',
                title: '🎣 "同事"发来的共享文件',
                badgeText: '鱼叉式钓鱼',
                badgeClass: 'badge-phishing',
                context: '你在工作 QQ 上收到一条消息，来自"同事李明"。消息说"这是下季度的预算表，你帮忙核对一下"，附带着一个名为"预算表_2025Q4.exe"的文件。你注意到李明的头像和名字都正确，但 QQ 号好像不太一样。',
                message: '李明：在吗？\n李明：这是下季度的预算表，领导催得急，你帮忙核对一下，有问题直接改。\n李明：[文件] 预算表_2025Q4.exe (2.3MB)\n李明：对了，我的 QQ 之前被盗了，这是我新号，你备注一下。',
                options: [
                    { text: '直接下载文件查看，领导催得急', type: 'bad', feedback: '❌ 危险！文件后缀是 .exe（可执行程序），不是真正的 Excel 表格。这是木马病毒，运行后可以窃取你的电脑文件、密码，甚至控制你的电脑。', verdict: '-1 分' },
                    { text: '通过电话或当面跟李明核实一下', type: 'good', feedback: '✅ 正确！先通过你存储的联系方式（原有 QQ、微信或电话）联系李明本人确认。即使 QQ 号不同也要先确认——很可能是骗子盗用了李明的身份信息。', verdict: '+1 分' },
                    { text: '问"李明"为什么发 exe 文件，等他解释', type: 'bad', feedback: '❌ 骗子会编造各种理由（"电脑中毒了自动打包的"、"你解压就行了"等）来说服你运行文件。不要跟骗子对话，直接通过其他渠道联系当事人核实。', verdict: '-1 分' }
                ]
            },
            {
                id: 6, category: 'social',
                title: '🔗 "免费领"的陷阱',
                badgeText: '社交媒体诈骗',
                badgeClass: 'badge-social',
                context: '你在朋友圈看到一条"免费领手机"的活动海报，扫码后跳转到一个页面，显示"恭喜你！你是今天的幸运用户！"页面要求填写姓名、电话、地址，并说只需要支付 29 元"邮费"就能领取价值 5999 元的手机。',
                message: '🎉 恭喜你成为今日幸运用户！🎉\n\n您已获得：iPhone 16 Pro Max（价值 5999 元）\n\n只需支付 29 元邮费即可领取！\n\n⚠️ 仅限前 100 名用户 ⚠️\n\n请填写收货信息：\n姓名：____\n电话：____\n地址：____\n\n（活动截止时间：23:59）',
                options: [
                    { text: '填写信息，付 29 元邮费，碰碰运气', type: 'bad', feedback: '❌ 这是骗局！所谓的"邮费"就是骗子的盈利。你可能付了 29 元后永远收不到"手机"，也可能收到一个廉价的小礼品。更严重的是，你的个人信息（姓名、电话、地址）会被卖给其他诈骗团伙。', verdict: '-1 分' },
                    { text: '不理会，天上不会掉馅饼', type: 'good', feedback: '✅ 正确！"免费送"+"付邮费"是经典骗局。记住：天上不会掉馅饼。正规的抽奖活动不会让你付钱。不贪小便宜是最好的防骗策略。', verdict: '+1 分' },
                    { text: '转发给朋友让他们也领，一起赚便宜', type: 'bad', feedback: '❌ 转发不但害了自己还害了朋友！骗子正是利用"转发裂变"来扩大骗局。不参与、不转发、不贪心，就是帮自己和朋友避坑。', verdict: '-1 分' }
                ]
            }
        ];

        let current = 0;
        let score = 0;

        function showScenario(index) {
            const s = scenarios[index];
            document.getElementById('progress-text').textContent = `场景 ${index + 1} / ${scenarios.length}`;
            
            const container = document.getElementById('scenario-container');
            
            let html = `
                <div class="sim-scenario">
                    <span class="badge ${s.badgeClass}">${s.badgeText}</span>
                    <h3>${s.title}</h3>
                    <div class="context">${s.context}</div>
                    <div class="sim-message">${s.message}</div>
                    <div class="action-btns" id="action-btns">
            `;
            
            s.options.forEach((opt, i) => {
                html += `<button class="action-btn" data-index="${i}" onclick="chooseAction(${index}, ${i})">${opt.text}</button>`;
            });
            
            html += `
                    </div>
                    <div id="feedback-${index}" class="sim-feedback"></div>
                </div>
            `;
            
            container.innerHTML = html;
            document.getElementById('score-display').textContent = score;
        }

        function chooseAction(scenarioIdx, actionIdx) {
            const s = scenarios[scenarioIdx];
            const opt = s.options[actionIdx];
            const feedback = document.getElementById(`feedback-${scenarioIdx}`);
            const buttons = document.querySelectorAll('.action-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                const opt2 = s.options[i];
                if (opt2.type === 'good') btn.className = 'action-btn good';
                else if (opt2.type === 'bad') btn.className = 'action-btn bad';
                else btn.className = 'action-btn neutral';
            });
            
            // Update score
            if (opt.type === 'good') score += 1;
            else if (opt.type === 'bad') score -= 1;
            document.getElementById('score-display').textContent = score;
            
            feedback.className = `sim-feedback show ${opt.type}`;
            feedback.innerHTML = `
                <h4>${opt.verdict}</h4>
                <p>${opt.feedback}</p>
            `;
            
            // Auto-advance
            setTimeout(() => {
                if (current < scenarios.length - 1) {
                    current++;
                    showScenario(current);
                } else {
                    showFinalResult();
                }
            }, 3000);
        }

        function showFinalResult() {
            const container = document.getElementById('scenario-container');
            let msg, emoji;
            if (score >= 4) { emoji = '🏆'; msg = '太厉害了！你有很强的安全意识，能在各种场景中做出正确的判断！'; }
            else if (score >= 1) { emoji = '👏'; msg = '表现不错！但还有一些场景需要留意。建议多看看案例库和防护指南。'; }
            else if (score >= -1) { emoji = '💪'; msg = '还需加强！你可能是骗子的目标人群，建议仔细阅读本站所有内容。'; }
            else { emoji = '🚨'; msg = '危险！你在很多场景中都做出了错误选择。请务必仔细学习本站内容，提高防骗意识！'; }
            
            container.innerHTML = `
                <div style="text-align:center;padding:40px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);">
                    <div style="font-size:4rem;margin-bottom:16px;">${emoji}</div>
                    <h2 style="margin-bottom:12px;">模拟完成！</h2>
                    <div style="font-size:2.5rem;font-weight:800;color:var(--primary);margin-bottom:8px;">${score}</div>
                    <div style="color:var(--text-secondary);margin-bottom:16px;">分（满分 6 分）</div>
                    <p style="font-size:1rem;color:var(--text-secondary);max-width:500px;margin:0 auto 24px;line-height:1.6;">${msg}</p>
                    <button class="btn btn-primary" onclick="resetSimulator()" style="background:var(--primary);color:white;">🔄 重新挑战</button>
                    <a href="scam-case.html" class="btn btn-secondary" style="color:var(--primary);border:2px solid var(--primary);">📚 学习案例库</a>
                </div>
                <div style="margin-top:16px;text-align:center;">
                    <button class="btn btn-secondary" onclick="reviewAllScenarios()" style="background:var(--bg);color:var(--primary);border:1px solid var(--primary);">📖 回顾所有场景</button>
                </div>
            `;
        }

        function reviewAllScenarios() {
            current = 0;
            score = 0;
            document.getElementById('score-display').textContent = '0';
            showScenario(0);
        }

        function resetSimulator() {
            current = 0;
            score = 0;
            document.getElementById('score-display').textContent = '0';
            showScenario(0);
        }

        showScenario(0);
    </script>
</body>
</html>
