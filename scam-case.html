<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诈骗案例库 — 安全培训</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .case-filter { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
        .filter-btn { padding: 8px 20px; border: 2px solid var(--border); border-radius: 20px; background: var(--bg); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; font-family: inherit; color: var(--text-secondary); }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .case-grid { display: grid; gap: 24px; max-width: 800px; margin: 0 auto; }
        .case-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: all 0.2s; }
        .case-card:hover { box-shadow: var(--shadow-lg); }
        .case-banner { padding: 16px 24px; color: white; font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        .case-banner.phishing { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .case-banner.social { background: linear-gradient(135deg, #ea580c, #c2410c); }
        .case-banner.tech { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        .case-banner.finance { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .case-banner.other { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .case-tag { background: rgba(255,255,255,0.2); padding: 2px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 400; }
        .case-body { padding: 20px 24px; }
        .case-body h3 { font-size: 1.05rem; margin-bottom: 8px; }
        .case-body .desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
        .case-body .warning-signs { background: var(--warning-light); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.85rem; line-height: 1.6; }
        .case-body .warning-signs strong { color: #92400e; }
        .case-body .warning-signs span { display: block; margin-bottom: 2px; }
        .case-body .prevention { background: var(--success-light); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.85rem; line-height: 1.6; margin-top: 8px; }
        .case-body .prevention strong { color: #166534; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🛡️ 安全培训</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="demo.html">模拟演示</a></li>
                <li><a href="password.html">密码检测</a></li>
                <li><a href="url-checker.html">URL检测</a></li>
                <li><a href="ransomware.html">勒索软件</a></li>
                <li><a href="scam-case.html" class="active">诈骗案例</a></li>
                <li><a href="security-simulator.html">安全模拟</a></li>
                <li><a href="safety-check.html">安全检查</a></li>
                <li><a href="quiz.html">测验</a></li>
                <li><a href="guide.html">防护指南</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>📚 诈骗案例库</h1>
            <p class="page-desc">真实的诈骗案例拆解，了解骗子的手法才能不上当。</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="case-filter" id="filter-bar">
                <button class="filter-btn active" data-filter="all" onclick="filterCases('all')">📋 全部</button>
                <button class="filter-btn" data-filter="phishing" onclick="filterCases('phishing')">📧 钓鱼诈骗</button>
                <button class="filter-btn" data-filter="social" onclick="filterCases('social')">🎭 社会工程</button>
                <button class="filter-btn" data-filter="tech" onclick="filterCases('tech')">💻 技术诈骗</button>
                <button class="filter-btn" data-filter="finance" onclick="filterCases('finance')">💰 金融诈骗</button>
            </div>

            <div class="case-grid" id="case-grid">
                <!-- 案例会由 JS 生成 -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>🔐 本网站为网络安全意识培训用途 · 不收集任何用户数据</p>
            <p>仅供教育和培训使用 · 请勿用于非法目的</p>
        </div>
    </footer>

    <script>
        const cases = [
            {
                id: 1, category: 'phishing',
                title: '「您的快递已滞留」—— 短信钓鱼',
                banner: '假冒快递短信诈骗',
                desc: '张先生收到一条短信："【快递通知】您的包裹因地址不详已滞留，请点击链接补充地址：http://sf-express.top/update"。张先生点击链接后输入了姓名、电话和地址，次日收到冒充快递员的电话称需要支付"关税"，被骗走 5000 元。',
                signs: '🔴 发件号码不是官方客服号\n🔴 链接域名不是官方域名\n🔴 索取超出快递服务范围的个人信息\n🔴 后续电话索要钱财',
                prevention: '✅ 快递问题请通过官方 App 查询\n✅ 不要点击短信中的链接\n✅ 任何要求"付费"的快递通知都是诈骗'
            },
            {
                id: 2, category: 'phishing',
                title:「冒充银行 ——「账户异常」邮件」,
                banner: '假冒银行安全验证',
                desc: '李女士收到一封"XX银行"邮件，称其账户存在"异地登录风险"，要求点击链接验证身份。邮件中的链接看起来是 bank.com 但实际指向 bank-com.secure-login.xyz。李女士输入了网银账号、密码和短信验证码，5 分钟后卡内 3 万元被转走。',
                signs: '🔴 发件地址非官方域名\n🔴 制造"异地登录"的紧迫感\n🔴 链接域名与银行不一致\n🔴 同时索要密码和验证码',
                prevention: '✅ 银行不会通过邮件索要密码和验证码\n✅ 手动输入官网地址登录\n✅ 开通账户变动短信提醒'
            },
            {
                id: 3, category: 'social',
                title: '「我是你领导」—— 冒充老板诈骗',
                banner: '冒充公司高管要求转账',
                desc: '某公司财务小王收到"老板"的微信好友申请，头像和昵称都和老板一样。"老板"以"正在开会不方便电话"为由，要求小王向一个"合作账户"加急转账 15 万元。小王转账后电话核实才发现老板根本不知情。',
                signs: '🔴 使用新的联系方式联系（新号/新好友申请）\n🔴 以"开会"、"不方便"为由拒绝电话核实\n🔴 要求紧急转账且"保密"\n🔴 收款账户信息异常',
                prevention: '✅ 转账前必须通过电话或当面确认\n✅ 建立双人复核的财务审批流程\n✅ 对"要求保密"的指令保持警惕'
            },
            {
                id: 4, category: 'social',
                title: '「我是客服」—— 冒充平台客服退款',
                banner: '假冒电商/平台客服',
                desc: '赵女士接到自称"淘宝客服"的电话，称她购买的商品有质量问题要退款。对方准确说出了她的订单信息，然后引导她下载"会议软件"并开启屏幕共享。通过屏幕共享，骗子看到了赵女士的银行卡信息和验证码，盗刷了 2 万元。',
                signs: '🔴 主动来电退款\n🔴 引导下载陌生 App 或开启屏幕共享\n🔴 要求提供银行卡号和验证码\n🔴 准确说出个人信息不代表是官方',
                prevention: '✅ 通过官方 App 或客服电话核实\n✅ 绝不开启屏幕共享\n✅ 任何索要验证码的都是诈骗\n✅ 电商退款会原路返回，不需要额外操作'
            },
            {
                id: 5, category: 'tech',
                title: '「你的电脑已中毒」—— 假冒技术支持',
                banner: '冒充微软/苹果技术支持',
                desc: '王大爷电脑上弹出一个全屏警告："您的电脑已被病毒感染！请立即拨打 400-XXX-XXXX 联系微软技术支持。"王大爷拨打电话后，对方远程连接了他的电脑，展示了"扫描出的病毒"，然后收取 800 元"杀毒费"。实际上对方只是运行了一个假的扫描程序。',
                signs: '🔴 浏览器弹窗警告（不是系统弹窗）\n🔴 要求拨打收费电话\n🔴 要求远程连接你的电脑\n🔴 声称检测到了不存在的"病毒"',
                prevention: '✅ 真正的杀毒软件不会用网页弹窗报警\n✅ 不要拨打弹窗上的电话\n✅ 不要允许陌生人远程控制你的电脑\n✅ 关闭浏览器重新打开即可消除弹窗'
            },
            {
                id: 6, category: 'tech',
                title: '「免费 WiFi」—— 钓鱼热点',
                banner: '公共 WiFi 钓鱼陷阱',
                desc: '陈先生在咖啡店连接了一个名为"Free_WiFi_5G"的免费 WiFi。连接后他登录了手机银行查看余额。第二天发现银行卡被盗刷。原来这个 WiFi 热点是黑客搭建的"中间人"攻击热点，所有通过该热点的数据（包括密码）都被截获。',
                signs: '🔴 不需要密码即可连接的开放 WiFi\n🔴 WiFi 名称模仿正规商家\n🔴 连接后弹出"登录/验证"页面\n🔴 页面要求输入手机号和验证码',
                prevention: '✅ 使用公共 WiFi 时不要登录银行等敏感账户\n✅ 使用 VPN 加密网络流量\n✅ 关闭"自动连接 WiFi"功能\n✅ 使用手机流量进行敏感操作'
            },
            {
                id: 7, category: 'finance',
                title:「「稳赚不赔」—— 投资诈骗」,
                banner: '虚假投资理财平台',
                desc: '刘阿姨在微信群看到"炒股大神"推荐的投资平台，声称"稳赚不赔"、"日收益 5%"。前两次投入 1000 元和 5000 元都顺利提现了收益。刘阿姨放心地投入了 20 万元，平台显示收益翻倍，但提现时发现平台已关闭，群也解散了。',
                signs: '🔴 承诺"稳赚不赔"、"高收益" \n🔴 前期小额可提现，后期大额无法提现\n🔴 拉人进群、营造"内部交流"氛围\n🔴 要求向下一个"级别"充值才能提现',
                prevention: '✅ 年化收益超过 6% 就要警惕\n✅ 正规投资理财产品都有备案\n✅ 不要轻信"内部消息"和"大神"推荐\n✅ 先学习基础理财知识再投资'
            },
            {
                id: 8, category: 'finance',
                title: '「你涉嫌洗钱」—— 冒充公检法',
                banner: '冒充警察/检察官/法官',
                desc: '周女士接到"公安局"电话，称其身份证被用于洗钱犯罪，要求配合"资产清查"。对方通过微信发送了"通缉令"和"警官证"照片。周女士按要求将名下所有存款转入"安全账户"共 50 万元。转完后才发现被骗。',
                signs: '🔴 自称公检法人员通过电话联系\n🔴 发送"通缉令"、"警官证"等伪造文件\n🔴 要求将资金转入"安全账户"\n🔴 要求保密，不得告知家人',
                prevention: '✅ 公检法不会通过电话办案\n✅ 不存在"安全账户"\n✅ 看到"通缉令"上的名字可以在 12377 官网核实\n✅ 立即挂断电话并拨打 110 核实'
            },
            {
                id: 9, category: 'phishing',
                title: '「来自同事的邮件」—— 鱼叉式钓鱼',
                banner: '精准针对企业员工的钓鱼',
                desc: '某公司员工收到一封来自"IT 部门"的邮件，要求所有员工点击链接更改密码系统（因"安全升级"）。邮件中提到的 IT 主管姓名和公司内部用语都是正确的。多名员工按提示输入了公司账户密码，导致公司内部系统被入侵，客户数据泄露。',
                signs: '🔴 发件地址与官方域名略有差异\n🔴 邮件中包含准确的公司内部信息（可能来自信息泄露）\n🔴 要求点击链接进行敏感操作\n🔴 制造"安全升级"等合合理借口',
                prevention: '✅ 公司应建立内部沟通的确认机制\n✅ IT 部门不会通过邮件链接要求改密码\n✅ 可疑邮件立即报告安全团队\n✅ 定期进行安全意识培训'
            },
            {
                id: 10, category: 'social',
                title: '「扫码领红包」—— 二维码钓鱼',
                banner: '恶意二维码诈骗',
                desc: '地铁站口有人举着"扫码领红包"的牌子，孙先生扫码后手机自动下载了一个 App。App 界面显示"领取成功，红包已到账"。但实际上该 App 是木马程序，后台窃取了孙先生的通讯录、短信和相册信息，随后利用这些信息盗取了孙先生多个社交账号。',
                signs: '🔴 陌生人/路边摊扫码活动\n🔴 扫码后自动下载 App\n🔴 要求"激活"或"验证"后领取\n🔴 需要授权大量手机权限',
                prevention: '✅ 不扫描不明来源的二维码\n✅ 扫码后要求下载 App 的立即取消\n✅ 在官方应用商店下载 App\n✅ 警惕过于诱人的"免费"活动'
            }
        ];

        function renderCases(filter) {
            const grid = document.getElementById('case-grid');
            const filtered = filter === 'all' ? cases : cases.filter(c => c.category === filter);
            
            grid.innerHTML = filtered.map(c => `
                <div class="case-card" data-category="${c.category}">
                    <div class="case-banner ${c.category}">
                        <span>${c.banner}</span>
                        <span class="case-tag">${categoryLabel(c.category)}</span>
                    </div>
                    <div class="case-body">
                        <h3>${c.title}</h3>
                        <div class="desc">${c.desc}</div>
                        <div class="warning-signs">
                            <strong>⚠️ 警示信号：</strong>
                            ${c.signs.split('\n').map(s => s.trim() ? `<span>${s}</span>` : '').join('')}
                        </div>
                        <div class="prevention">
                            <strong>🛡️ 防范方法：</strong>
                            ${c.prevention.split('\n').map(s => s.trim() ? `<span>${s}</span>` : '').join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function categoryLabel(cat) {
            const map = { phishing: '📧 钓鱼', social: '🎭 社会工程', tech: '💻 技术诈骗', finance: '💰 金融诈骗' };
            return map[cat] || cat;
        }

        function filterCases(filter) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            renderCases(filter);
        }

        renderCases('all');
    </script>
</body>
</html>
